[orchestrator]
max_iterations = 3
auto_commit = false
verbose = false

[agents.claude]
command = "claude"
model = "sonnet"
timeout = 300
enabled = true

[agents.codex]
command = "codex"
model = "o4-mini"
timeout = 300
enabled = true

[costs]
warn_threshold_usd = 1.0
hard_limit_usd = 5.0

[git]
auto_branch = true
branch_prefix = "synapse/"
commit_prefix = "[synapsecode]"
